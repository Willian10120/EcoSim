<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco Simulador</title>
    <link href="./css/output.css" rel="stylesheet"> 
</head>
<body>

    <!--Cabeçalho 1-->
    <header class="bg-white border-b border-slate-300 p-4 flex justify-between itens-center">
        <h1 class="text-2xl font-bold text-green-700">Eco Simulador</h1>
        <nav class="flex gap-4 font-bold text-green-900">
            <a href="#simulador">Simulador</a>
            <a href="#dados">Dados</a>
            <a href="#sobre">Sobre</a>
        </nav>
    </header>

    <!--Inicio do simulador-->
    <main class="max-w-4xl mx-auto p-4">
        <section id="simulador">
            <h2 class="text-xl font-bold">Simulador Urbano</h2>

            <!-- layer dividida em 3 colunas (cidade ocupa2/3)-->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 my-4">

                <!--cidade pre-betakk-->
                <div id="cidade" class="md:col-span-2 relative h-64 rounded-xl overflow-hidden bg-slate-700">
                    <div id="fumaca" class="absolute inset-0 bg-gray-600/70"></div>
                    <div id="arvore" class="absolute inset-0 bg-emerald-500/40 hidden"></div>
                    <div id="mobilidade" class="absolute inset-0 bg-sky-500/40 hidden"></div>
                    <div id="energia" class="absolute inset-0 bg-amber-400/40 hidden"></div>
                </div>

            <!--Controles (funcionando)-->
            <div class="p-4 bg-white border border-slate-300 rounded-xl">   
                <h3 class="mb-2 text-lg font bold">Controles</h3>

            <!--ate que em fim fiz essa desgraçã funcionar ksksk(so funciona o primeiro botao) agora funciona todos :D -->
                <button id="p1-botao" class="flex items-center gap-3 w-full py-2 cursor-pointer">
                    <span id="p1-trilho" class="w-11 h-6 p-1 rounded-full bg-slate-300 transition">
                        <span id="p1-bolinha" class="block w-4 h-4 rounded-full bg-white transition"></span>
                    </span>
                    Arborização
                </button>

                <button id="p2-botao" class="flex items-center gap-3 w-full py-2 cursor-pointer">
                    <span id="p2-trilho" class="w-11 h-6 p-1 rounded-full bg-slate-300 transition">
                        <span id="p2-bolinha" class="block w-4 h-4 rounded-full bg-white transition"></span>
                    </span>
                    Mobilidade Sustentavel
                </button>

                <button id="p3-botao" class="flex items-center gap-3 w-full py-2 cursor-pointer">
                    <span id="p3-trilho" class="w-11 h-6 p-1 rounded-full bg-slate-300 transition">
                        <span id="p3-bolinha" class="block w-4 h-4 rounded-full bg-white transition"></span>
                    </span>
                    Energia Limpa
                </button>

                <!--medidor (tentando fazer(talvez seja excluído kk))-->
                <div class="mt-4 pt-4 border-t border-slate-300">
                    <p class="text-sm font-bold">Qualidade do Ar: <span id="nvl-qualidade-ar">Crítica</span></p>
                    <div class="mt-2 h-4 rounded-full bg-slate-200 overflow-hidden">
                        <div id="bar-ar" class="h-full rounded-full transition-all duration-500"></div>    
                    </div>
                </div>
            </div>
        </div>
    </section>
        <section id="dados"></section>
        <section id="sobre"></section>
    </main>
    <footer></footer>
    <script src="./js/script.js"></script>
</body>
</html>
