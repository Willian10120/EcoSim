<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco Simulador</title>
    <link href="./css/output.css" rel="stylesheet"> 
</head>
<body>
    <!--Cabeçalho 1-->
    <header class="bg-white border-b border-slate-300 p-4 flex justify-between itens-center">
        <h1 class="text-2x1 font-bold text-green-700">Eco Simulador</h1>
        <nav class="flex gap-4 font-bold text-green-900">
            <a href="#simulador">Simulador</a>
            <a href="#dados">Dados</a>
            <a href="#sobre">Sobre</a>
        </nav>
    </header>
    <!--Inicio do simulador-->
    <main class="max-w-4xl mx-auto p-4">
        <section id="simulador">
            <h2>Simulador Urbano</h2>
            <div id="cidade" class=" relative w-full h-64 my-4 rounded-xl overflow-hidden bg-slate-700">
                <div id="fumaca" class="absolute inset-0 bg-gray-600/70"></div>
                <div id="arvore" class="absolute inset-0 bg-emerald-500/40 hidden"></div>
                <div id="mobilidade" class="absolute inset-0 bg-sky-500/40 hidden"></div>
                <div id="energia" class="absolute inset-0 bg-amber-400/40 hidden"></div>
            </div>
            <!--ate que em fim fiz essa desgraçã funcionar ksksk(so funciona o primeiro botao)-->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4"> 
                <button id="p1-botao" class="p-4 bg-emerald-600 text-white rounded-lg font-bold">
                Arborização
            </button>
            <button id="p2-botao" class="p-4 bg-emerald-600 text-white rounded-lg font-bold">
                Mobilidade Sustentavel
            </button>
            <button id="p3-botao" class="p-4 bg-emerald-600 text-white rounded-lg font-bold">
                Energia Limpa
            </button>
            </div>
        </section>
        <section id="dados"></section>
        <section id="sobre"></section>
    </main>
    <footer></footer>
    <script src="./js/script.js"></script>
</body>
</html>
